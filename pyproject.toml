[project]
name = "rl-beijing"
version = "0.1.0"
description = "北京浮生记 — Beijing Fushengji web remake + LLM agent benchmark"
requires-python = ">=3.10"

dependencies = [
    # Backend
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.0",
    # Harness
    "httpx>=0.27",
    "openai>=1.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[tool.uv.sources]
# All deps from PyPI, no local path overrides needed

[project.scripts]
be-benchmark = "harness.main:main"

[tool.uv]
dev-dependencies = []